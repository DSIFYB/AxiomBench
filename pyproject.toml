[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiombench"
version = "0.3.0"
description = "Reproducible AI evaluation: reasoning, C++ generation and repair, mathematics"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
axiombench = "axiombench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
